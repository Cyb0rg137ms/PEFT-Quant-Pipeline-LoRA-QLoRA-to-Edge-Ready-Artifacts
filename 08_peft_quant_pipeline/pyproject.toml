[tool.poetry]
name = "peft-quant-pipeline"
version = "1.0.0"
description = "Low-Rank Adaptation (LoRA) and Uniform symmetric Quantization Compile Pipeline"
authors = ["Software & AI Developer"]
readme = "README.md"
packages = [{include = "pipeline"}]

[tool.poetry.dependencies]
python = "^3.9"
